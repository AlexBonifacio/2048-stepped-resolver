name: Deploy to o2switch

# o2switch's firewall blocks SSH from GitHub's runners, so the site cannot
# be pushed to the host. Instead, the built site is committed to the
# `o2switch-deploy` branch, and the o2switch server pulls it on a cron:
#
#   one-time setup on the server (SSH):
#     git clone --branch o2switch-deploy --single-branch \
#         https://github.com/<owner>/<repo>.git ~/deploy-2048
#
#   cPanel cron (every 5 minutes):
#     cd $HOME/deploy-2048 && git fetch -q origin o2switch-deploy \
#       && git reset -q --hard origin/o2switch-deploy \
#       && rsync -a --delete --exclude=.git ./ $HOME/<site-directory>/

on:
  workflow_dispatch:
  push:
    branches:
      - web-version

permissions:
  contents: write

concurrency:
  group: o2switch
  cancel-in-progress: true

jobs:
  build-deploy-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM solver
        run: tools/build_wasm.sh

      - name: Assemble static site
        run: python3 tools/build_webapp.py

      - name: Push site to o2switch-deploy branch
        run: |
          cd web-dist
          git init -q -b o2switch-deploy
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::10}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" o2switch-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
